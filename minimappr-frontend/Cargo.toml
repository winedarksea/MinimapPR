[package]
name = "minimappr-frontend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "minimappr-frontend"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlAudioElement",
    "Event",
    "KeyboardEvent",
    "EventTarget",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CloseEvent",
    "ErrorEvent",
    "Storage",
    "Location",
] }
gloo-net = { version = "0.6", features = ["http", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"
futures = "0.3"

[features]
default = []

[profile.release]
opt-level = "s"
lto = true
