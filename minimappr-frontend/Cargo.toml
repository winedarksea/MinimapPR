[package]
name = "minimappr-frontend"
version = "0.1.0"
edition = "2021"

# Own workspace root. The repo-root workspace `exclude`s this crate, but Cargo
# keeps walking up past an exclude, so a checkout nested under another
# MinimapPR checkout (e.g. .claude/worktrees/*) would otherwise be claimed by
# the outer workspace and fail to build.
[workspace]

[[bin]]
name = "minimappr-frontend"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlAudioElement",
    "Blob",
    "Event",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "EventTarget",
    "File",
    "FileList",
    "FormData",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlDivElement",
    "CloseEvent",
    "ErrorEvent",
    "Storage",
    "Clipboard",
    "Location",
    "Navigator",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "AudioContext",
    "AudioBuffer",
    "DomRect",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
] }
gloo-net = { version = "0.6", features = ["http", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"
futures = "0.3"

# --- Field Mode PWA (W4-pwa): only built with `--features field-pwa`
# (Trunk.field.toml / field.html), so the server-backed COP build is
# unaffected. minimappr-core: Stage-1, clip codec, protocol, sealing;
# minimappr-transport: the sans-IO relay client + browser adapter. ---
minimappr-core = { path = "../minimappr-core", optional = true }
minimappr-transport = { path = "../minimappr-transport", optional = true, default-features = false, features = ["web-websocket"] }
minimappr-relay-wire = { path = "../minimappr-relay-wire", optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
# --- end Field Mode PWA ---

[features]
default = []
field-pwa = [
    "dep:minimappr-core",
    "dep:minimappr-transport",
    "dep:minimappr-relay-wire",
    "dep:rand_core",
]

[profile.release]
opt-level = "s"
lto = true
