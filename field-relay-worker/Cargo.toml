[package]
name = "field-relay-worker"
version = "0.1.0"
edition = "2021"
description = "Field Mode relay: Cloudflare Worker (join codes in D1) + one hibernating Durable Object per session forwarding opaque sealed frames."

# Own workspace root: this is a wasm32-only Worker built by worker-build /
# wrangler, so it must not join the root workspace's native
# `cargo test --workspace` build. It shares the relay contract with
# minimappr-transport through the tiny `minimappr-relay-wire` crate.
[workspace]

[lib]
crate-type = ["cdylib"]

# Pinned to the worker-build 0.7.x toolchain (worker and worker-build must
# share a minor version).
[dependencies]
minimappr-relay-wire = { path = "../minimappr-relay-wire" }
worker = { version = "=0.7.5", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
sha2 = "0.10"
js-sys = "0.3"

# worker-macros 0.7.5 uses syn items gated behind syn's `full` feature but
# does not request it (it relies on some other crate turning it on). Build
# dependencies share the host feature set with proc-macros under resolver 2,
# so this line is what makes the macros compile. Nothing else uses it.
[build-dependencies]
syn = { version = "2", features = ["full"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
