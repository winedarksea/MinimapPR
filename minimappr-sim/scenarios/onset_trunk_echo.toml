# W2-onset-srp: one bird, two bouts, strong explicit trunk reflectors (about -4 to
# -6 dB, 3-25 ms late) near the layout. Echo events (apparent source = trunk) are
# derived from the ground-truth reflector list at scoring time.
name = "onset_trunk_echo"
seed = 20261122
duration_s = 10.0
sample_rate_hz = 24000

[site]
origin_lat = 45.0
origin_lon = -93.0
origin_alt_m = 250.0
start_time_ns = 1763700000000000000

[environment]
temperature_c = 18.0
humidity_fraction = 0.6

[ground]
enabled = true
reflection_coefficient = 0.5

[ambient_noise]
level_db_spl = 30.0

[[devices]]
device_id = "tetra-a"
kind = "sirith_tetra"
position_m = [0.0, 0.0, 1.5]

[[devices]]
device_id = "tetra-b"
kind = "sirith_tetra"
position_m = [20.0, 0.0, 1.5]

[[devices]]
device_id = "tetra-c"
kind = "sirith_tetra"
position_m = [10.0, 18.0, 1.5]

[[reflectors.explicit]]
reflector_id = "trunk-1"
position_m = [2.0, 6.0, 1.5]
reflection_coefficient = 0.6

[[reflectors.explicit]]
reflector_id = "trunk-2"
position_m = [14.0, 4.0, 1.5]
reflection_coefficient = 0.5

[[sources]]
individual_id = "thrush-1"
species = "Wood Thrush"
position_m = [8.0, 10.0, 4.0]

[[sources.calls]]
start_s = 1.0
level_db_spl_at_1m = 90.0
generator = { kind = "fm_sweep", start_frequency_hz = 3800.0, end_frequency_hz = 2600.0, duration_s = 0.3 }

[[sources.calls]]
start_s = 6.0
level_db_spl_at_1m = 90.0
generator = { kind = "fm_sweep", start_frequency_hz = 3800.0, end_frequency_hz = 2600.0, duration_s = 0.3 }


[expectations]
schema_version = 2

[expectations.runtime]
classifier_backend = "stub"
replay_reference_nodes = false

[expectations.runtime.settings_overrides]
trigger_rms = 0.003
classification_window_seconds = 1.0

[expectations.classification]
min_label_accuracy = 0.0
match = "exact"

[expectations.localization]
min_event_recall = 0.0
max_median_position_error_m = 1000.0
max_p90_position_error_m = 1000.0
far_field_distance_m = 120.0

[expectations.entities]
association_radius_m = 5.0
association_time_slop_s = 2.0
