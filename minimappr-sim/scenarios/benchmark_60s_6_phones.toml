# Render-speed benchmark from the test strategy: 60 s, 6 phones (two of
# them stereo), 4 chirp rounds, 10 overlapping calls, ground + 5 trunks.
# Target: < 0.5 s plan+render in a release build.
name = "benchmark_60s_6_phones"
seed = 7
duration_s = 60.0
sample_rate_hz = 48000

[reflectors.random_trunks]
count_range = [5, 5]

[chirps]
round_start_times_s = [2.0, 17.0, 32.0, 47.0]
slot_duration_s = 0.25
level_db_spl_at_1m = 95.0
waveform = { band_low_hz = 15000.0, band_high_hz = 18000.0, duration_s = 0.05, waveform = "hyperbolic_fm" }

[[devices]]
device_id = "phone-1"
kind = "phone"
position_m = [0.0, 0.0, 1.2]
second_mic = {}

[[devices]]
device_id = "phone-2"
kind = "phone"
position_m = [8.0, 1.0, 1.3]

[[devices]]
device_id = "phone-3"
kind = "phone"
position_m = [4.0, 7.0, 1.1]
second_mic = {}

[[devices]]
device_id = "phone-4"
kind = "phone"
position_m = [-5.0, 5.0, 1.4]
mic_response = { lowpass_hz = 16000.0, lowpass_order = 8 }

[[devices]]
device_id = "phone-5"
kind = "phone"
position_m = [-3.0, -6.0, 1.2]

[[devices]]
device_id = "phone-6"
kind = "phone"
position_m = [6.0, -5.0, 0.9]

[[sources]]
individual_id = "wtsp-1"
species = "White-throated Sparrow"
position_m = [25.0, 30.0, 6.0]
calls = [
  { start_s = 5.0, generator = { kind = "tonal_whistle" } },
  { start_s = 21.0, generator = { kind = "tonal_whistle" } },
  { start_s = 40.0, generator = { kind = "tonal_whistle" } },
]

[[sources]]
individual_id = "chsp-1"
species = "Chipping Sparrow"
position_m = [-30.0, 12.0, 8.0]
calls = [
  { start_s = 5.5, generator = { kind = "trill" } },
  { start_s = 33.0, generator = { kind = "trill" } },
]

[[sources]]
individual_id = "amro-1"
species = "American Robin"
position_m = [10.0, -40.0, 12.0]
calls = [
  { start_s = 12.0, generator = { kind = "fm_sweep" } },
  { start_s = 12.4, generator = { kind = "fm_sweep", start_frequency_hz = 2400.0, end_frequency_hz = 3600.0 } },
  { start_s = 50.0, generator = { kind = "fm_sweep" } },
]

[[sources]]
individual_id = "blja-1"
species = "Blue Jay"
position_m = [-15.0, -20.0, 10.0]
calls = [
  { start_s = 26.0, level_db_spl_at_1m = 92.0, generator = { kind = "harsh" } },
  { start_s = 55.0, level_db_spl_at_1m = 92.0, generator = { kind = "harsh" } },
]
