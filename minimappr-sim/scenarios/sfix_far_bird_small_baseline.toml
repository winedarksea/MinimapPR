# S-fixes onset: a bird ~80 m out seen by a compact 10 m triangle (baseline << range): range is
# weakly observable and must not be published as a confident far fix.
name = "sfix_far_bird_small_baseline"
seed = 20261122
duration_s = 8.0
sample_rate_hz = 24000

[site]
origin_lat = 45.0
origin_lon = -93.0
origin_alt_m = 250.0
start_time_ns = 1763700000000000000

[environment]
temperature_c = 18.0
humidity_fraction = 0.6

[ground]
enabled = true
reflection_coefficient = 0.5

[ambient_noise]
