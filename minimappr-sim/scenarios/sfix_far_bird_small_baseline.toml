[[devices]]
device_id = "tetra-a"
kind = "sirith_tetra"
position_m = [0.0, 0.0, 1.5]

[[devices]]
device_id = "tetra-b"
kind = "sirith_tetra"
position_m = [10.0, 0.0, 1.5]

[[devices]]
