org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# iOS targets are declared but only built on a host with full Xcode (see
# shared/build.gradle.kts); silence the "disabled targets" warning elsewhere.
kotlin.native.ignoreDisabledTargets=true
# Rust build variant for the host-JVM unit-test library and for iOS.
fieldapp.rust.variant=debug
