org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# iOS targets are declared but only built on a host with full Xcode (see
# shared/build.gradle.kts); silence the "disabled targets" warning elsewhere.
kotlin.native.ignoreDisabledTargets=true
# Rust build variant for the host-JVM unit-test library and for iOS.
fieldapp.rust.variant=debug
# Android Rust/APK ABIs. Device builds default to arm64 only (halves the
# Rust build); pass -Pfieldapp.android.abis=arm64-v8a,x86_64 for emulators.
fieldapp.android.abis=arm64-v8a
# Rust variant for the Android library only. Debug-built DSP is too slow on a
# phone (plan finding 10), so devices default to release while the APK stays
# debug. Override with -Pfieldapp.rust.android.variant=debug.
fieldapp.rust.android.variant=release
