# Android requires 16 KB-aligned ELF LOAD segments (Play policy; 16 KB-page
# devices refuse misaligned libs). rustc's Android targets still default to
# 4 KB, so the field app's libminimappr_ffi.so needs this explicitly.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
