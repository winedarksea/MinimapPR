[package]
name = "minimappr-core"
version = "0.1.0"
edition.workspace = true
description = "Sans-IO DSP and localization core shared by the MinimapPR sidecar and Field Mode nodes."

# Keep this crate free of tokio/axum/rusqlite/rayon so it builds for
# wasm32-unknown-unknown, aarch64-linux-android and aarch64-apple-ios.
[dependencies]
base64 = { workspace = true }
num-complex = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# --- W2-core-srp: layout-SRP scenario tests render audio with the Layer 1
# simulator. Dev-only, so the sim's rayon/zip never reach wasm/android lib
# builds; minimappr-sim does not depend on minimappr-core (no cycle).
minimappr-sim = { path = "../minimappr-sim" }
# --- end W2-core-srp

[[bench]]
name = "capture_plane"
harness = false

# W2-core-srp: per-solve runtime of layout SRP (release).
[[bench]]
name = "layout_srp"
harness = false

[features]
default = []
# Emit SensorStreamBuffer re-anchor warnings through `tracing`.
tracing = ["dep:tracing"]
