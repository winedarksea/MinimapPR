[package]
name = "minimappr-core"
version = "0.1.0"
edition.workspace = true
description = "Sans-IO DSP and localization core shared by the MinimapPR sidecar and Field Mode nodes."

# Keep this crate free of tokio/axum/rusqlite/rayon so it builds for
# wasm32-unknown-unknown, aarch64-linux-android and aarch64-apple-ios.
[dependencies]
base64 = { workspace = true }
num-complex = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }

# --- W2-core-sync (chirp sync, clock model, layout) ---
# nalgebra: symmetric eigen (MDS), SVD (Kabsch/pseudo-inverse), dense solves.
# default-features off keeps nalgebra-macros out; std is enough for wasm32
# and aarch64-linux-android.
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
# --- end W2-core-sync ---

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# W2-core-sync: Layer 1 simulator for sync scenario tests and the Phase 1
# pre-study example. Dev-only; the sim never depends on core.
minimappr-sim = { path = "../minimappr-sim" }

[[bench]]
name = "capture_plane"
harness = false

[features]
default = []
# Emit SensorStreamBuffer re-anchor warnings through `tracing`.
tracing = ["dep:tracing"]
