[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimappr"
version = "0.2.1"
description = "Realtime environmental awareness: distributed sound localization + classification + common operating picture"
readme = "README.md"
license = "GPL-3.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Colin Catlin", email = "colin.catlin@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "fastapi>=0.116,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "numpy>=1.26,<2.3",
    "scipy>=1.11,<1.17",
    "pydantic>=2.8,<3.0",
    "aiosqlite>=0.21,<1.0",
    "httpx>=0.28,<1.0",
    "pyyaml>=6.0,<7.0",
    # tensorflow-metal 1.2.0 on Apple Silicon requires tensorflow==2.18.*;
    # loosen the lower bound so Mac installs are not blocked.
    "tensorflow>=2.18,<3.0",
    "tf-keras>=2.18,<3.0",
    "tensorflow-hub>=0.16,<1.0",
    "onnxruntime>=1.18,<2.0",
]

[project.optional-dependencies]
birdnet = [
    "birdnet>=0.2.12,<1.0",
]
effector = [
    "onvif-zeep-async>=3.1,<5.0",
]
stt = [
    "huggingface-hub>=0.30,<1.0",
    "transformers>=4.48,<5.0",
]
train = [
    "tf2onnx>=1.16",
    "onnx>=1.16",
    # Fetch script only (scripts/fetch_drone_audio.py); the trainer itself needs
    # nothing beyond the core deps.
    "huggingface-hub>=0.30,<1.0",
    "pyarrow>=15.0",
]
full = [
    "birdnet>=0.2.12,<1.0",
    "onvif-zeep-async>=3.1,<5.0",
    "huggingface-hub>=0.30,<1.0",
    "transformers>=4.48,<5.0",
]
process-title = [
    "setproctitle>=1.3",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<2.0",
]

[project.urls]
Homepage = "https://github.com/winedarksea/MinimapPR"
Repository = "https://github.com/winedarksea/MinimapPR"
Issues = "https://github.com/winedarksea/MinimapPR/issues"

[project.scripts]
minimappr = "minimappr.__main__:main"
minimappr-demo = "minimappr.sim.run_demo:main"

[tool.setuptools.packages.find]
include = ["minimappr*"]

[tool.setuptools.package-data]
minimappr = ["frontend/*.html", "frontend/*.css", "frontend/*.js", "frontend/*.wasm", "frontend/*.ts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
