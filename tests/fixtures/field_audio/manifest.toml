# Field-mode real-audio fixtures (dry-ish, close, high-SNR bird calls + one ambience bed).
# Source of truth for tests/field_audio_fixtures.py and scripts/build_field_audio_fixtures.py.
# All clips: 48 kHz, mono, 16-bit PCM WAV. See ATTRIBUTION for credits and processing.
#
# band_hz is a hand estimate of the clip's dominant energy band (from spectrograms), not a
# measured -20 dB bandwidth; tests and sims use it for band-limited GCC/SRP checks.
# same_band_group links clips whose energy overlaps enough to stress label swaps.
# needs_listen_check = true marks clips a human should audition before wider sharing (speech
# screening was spectral only).

format_version = 1
sample_rate_hz = 48000
bird_peak_dbfs = -3.0
ambience_rms_dbfs = -30.0

