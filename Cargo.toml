# MinimapPR Rust workspace.
#
# Members share one Cargo.lock and one target/ directory at the repo root.
# Profiles must live here: Cargo ignores [profile.*] in member manifests.
# minimappr-sim gets per-package overrides: its renderer is 10-50x slower
# unoptimised, which makes physics tests crawl. Per-package overrides keep
# the rest of the workspace on default profiles (lto cannot be per-package,
# so the sim's former `lto = "thin"` is dropped; codegen-units = 1 recovers
# most of it).
#
# Planned members (added when their streams merge): minimappr-transport.
#
# minimappr-frontend is excluded: it is a wasm32-only Leptos/trunk app with
# its own [profile.release] (opt-level = "s", lto) that would otherwise have
# to be hoisted here and applied to the native sidecar, and
# `cargo test --workspace` on the host would try to build its
# web-sys/wasm-bindgen graph natively. It keeps its own Cargo.lock and is
# built with trunk from its directory; it can still path-depend on
# minimappr-core.
[workspace]
resolver = "2"
members = [
    "minimappr-core",
    "minimappr-ingest-sidecar",
    "minimappr-mesh-sim",
    "minimappr-sim",
]
exclude = [
    "minimappr-frontend",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
minimappr-core = { path = "minimappr-core" }
base64 = "0.22"
num-complex = "0.4"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.test.package.minimappr-sim]
opt-level = 3

[profile.dev.package.minimappr-sim]
opt-level = 3

[profile.release.package.minimappr-sim]
opt-level = 3
codegen-units = 1

# W3-mesh-sim: the Layer 2 suite has a 5 s budget for 10 seeds, so the
# simulator and the core solver it drives run optimised under test.
[profile.test.package.minimappr-mesh-sim]
opt-level = 3

[profile.dev.package.minimappr-mesh-sim]
opt-level = 3

# The mesh simulator drives the core solver (arrival grid + LM) hundreds of
# times per PR run; unoptimised it dominates the 5 s budget. This also
# speeds up minimappr-core's own slow debug tests (stage1_trigger ~16 s).
[profile.test.package.minimappr-core]
opt-level = 3
