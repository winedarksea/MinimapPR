<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle — dark COP/radar background -->
  <circle cx="32" cy="32" r="31" fill="#0d1117" stroke="#1e3a2f" stroke-width="1.5"/>

  <!-- Range rings -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="#1a6640" stroke-width="1"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#1a6640" stroke-width="1"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#1a6640" stroke-width="0.75"/>

  <!-- Crosshair lines -->
  <line x1="32" y1="4"  x2="32" y2="60" stroke="#1a6640" stroke-width="0.75" opacity="0.6"/>
  <line x1="4"  y1="32" x2="60" y2="32" stroke="#1a6640" stroke-width="0.75" opacity="0.6"/>

  <!-- Radar sweep arc — one frozen sweep slice -->
  <path d="M32 32 L32 4 A28 28 0 0 1 56.2 42.5 Z"
        fill="#22c55e" fill-opacity="0.08"/>
  <line x1="32" y1="32" x2="56.2" y2="42.5"
        stroke="#22c55e" stroke-width="1" opacity="0.5"/>

  <!-- Origin sensor node -->
  <circle cx="32" cy="32" r="2.5" fill="#4ade80"/>

  <!-- Track A — confirmed (bright green) -->
  <circle cx="48" cy="22" r="2.5" fill="#22c55e"/>

  <!-- Track B — tentative (amber) -->
  <circle cx="18" cy="44" r="2" fill="#f59e0b"/>

  <!-- Velocity leader for track A -->
  <line x1="48" y1="22" x2="53" y2="17" stroke="#22c55e" stroke-width="1" opacity="0.7"/>
</svg>
